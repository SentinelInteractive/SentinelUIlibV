<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebUI Redline - v0.2.4 Beta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="settings.css">
</head>
<body>

<div class="pause-overlay" onclick="closeKeyPicker()"></div>

<div class="relative z-10 p-6 h-full flex flex-col max-w-[1400px] mx-auto">
    <div class="flex justify-between items-end mb-2">
        <h1 class="text-white text-7xl font-bold italic tracking-tighter drop-shadow-2xl">WebUI</h1>
        <button id="save-btn" onclick="saveSettings()" class="bg-red-700 hover:bg-white hover:text-red-700 text-white font-bold py-2 px-8 rounded shadow-2xl transition-all duration-200 border-2 border-red-700 hover:border-white tracking-widest uppercase">SAVE CONFIG</button>
    </div>
    <div class="w-full bg-white text-black font-bold uppercase py-2 text-xl tracking-[0.4em] mb-1 text-center shadow-2xl">Settings</div>

    <div class="flex flex-1 gap-3 overflow-hidden mt-1 pb-4">
        <div class="w-1/4 flex flex-col gap-1">
            <button onclick="showSection('general')" id="btn-general" class="tab-button">General</button>
            <button onclick="showSection('display')" id="btn-display" class="tab-button">Display</button>
            <button onclick="showSection('experimental')" id="btn-experimental" class="tab-button">Experimental</button>
            <button onclick="showSection('keybinding')" id="btn-keybinding" class="tab-button">Key Binding</button>
            <button onclick="showSection('performance')" id="btn-performance" class="tab-button">Performance</button>
            <button onclick="showSection('about')" id="btn-about" class="tab-button">About</button>
        </div>

        <div class="flex-1 flex flex-col gap-2">
            <div class="flex-1 bg-black/90 overflow-hidden border-r-4 border-red-600/30 flex flex-col" id="settings-content-wrapper">
                <div id="warning-area"></div>
                <div class="flex-1 overflow-hidden" id="settings-content"></div>
            </div>
            
            <div id="desc-box" class="p-3 opacity-0 text-white transition-opacity duration-150">
                <p id="desc-text" class="text-xs uppercase tracking-widest leading-tight text-gray-300"></p>
            </div>
        </div>
    </div>
</div>

<div id="key-picker">
    <div class="bg-white text-black text-center p-2 font-bold uppercase tracking-widest">Select Key</div>
    <div id="key-list" class="overflow-y-auto max-h-[350px] custom-scroll"></div>
</div>

<script src="settings.js"></script>
</body>
</html>
