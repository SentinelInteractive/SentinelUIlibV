<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SentinelUI helper selftest</title>
</head>
<body style="margin:0;background:transparent">
  <!-- Helper self-test page: loaded from a filesystem path (file://) through the helper's
       --content argument. Keep the box geometry fixed so runs stay comparable. The inline
       script is fine on file://; pages served through sentinelui:// must ship JS as files. -->
  <div style="position:absolute;left:16px;top:16px;width:260px;height:120px;
       background:rgba(0,120,255,0.65);padding:12px;color:#fff;font:bold 28px sans-serif">
    SentinelUI helper selftest
  </div>
  <div style="position:absolute;left:16px;top:160px;color:#e7e5df;
       font:14px Consolas,monospace;text-shadow:0 1px 2px rgba(0,0,0,.8)">
    transparent OSR page, background should show through
  </div>
  <script>setTimeout(function(){ console.log('NUI_TEST:helper-alive'); },300);</script>
</body>
</html>
