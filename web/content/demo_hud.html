<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SentinelUI P2 demo — HUD strip</title>
<style>
  :root { --hud-bg: rgba(8,12,20,0.55); --hud-accent: #3fa7ff; --hud-text: #e8edf5; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; color: var(--hud-text); }
  .hud {
    position: fixed; left: 50%; top: 12px; transform: translateX(-50%);
    display: flex; gap: 22px; align-items: center;
    background: var(--hud-bg); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 8px; padding: 8px 18px; letter-spacing: .06em;
  }
  .tag { color: var(--hud-accent); font-weight: 700; font-size: 13px; text-transform: uppercase; }
  .item { font-size: 13px; color: #b8c6da; font-variant-numeric: tabular-nums; }
  .ct { font-size: 11px; color: #7889a3; font-family: Consolas, monospace; }
</style>
</head>
<body>
  <!-- Layer 2 in the acceptance test: composites ABOVE the boot layer (z 10) and is
       click-through, so clicks pass to the interactive demo panel below. -->
  <div class="hud">
    <span class="tag">SentinelUI</span>
    <span class="item" id="clock">--:--:--</span>
    <span class="item">layer <b>2</b> · z 10 · click-through</span>
    <span class="ct">sentinelui://sui/demo_hud.html</span>
  </div>
  <script src="demo_hud.js"></script>
</body>
</html>
