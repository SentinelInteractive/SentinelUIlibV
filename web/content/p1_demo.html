<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SentinelUI P1 demo</title>
<style>
  :root { --p1-bg: rgba(10,14,22,0.72); --p1-accent: #d92534; --p1-text: #e8edf5; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif; color: var(--p1-text);
    display: flex; align-items: flex-start; justify-content: center; padding-top: 6vh;
  }
  .panel {
    width: min(920px, 92vw);
    background: var(--p1-bg);
    border: 1px solid rgba(255,255,255,0.14);
    border-left: 6px solid var(--p1-accent);
    border-radius: 10px; padding: 22px 26px; backdrop-filter: none;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
  }
  h1 { font-size: 26px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; }
  .sub { color: #9fb1c8; font-size: 13px; margin-top: 2px; letter-spacing: .04em; }
  .row { display: flex; gap: 26px; margin-top: 18px; align-items: center; }
  .clock { font-variant-numeric: tabular-nums; font-size: 38px; font-weight: 600; color: #ffd166; }
  .btn {
    background: var(--p1-accent); color: #fff; border: 0; border-radius: 6px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; letter-spacing: .05em;
  }
  .btn:hover { filter: brightness(1.15); }
  .hint { margin-top: 14px; font-size: 12px; color: #7889a3; font-family: Consolas, monospace; }
  #logline { margin-top: 12px; min-height: 18px; font-size: 13px; color: #7ee787; }
</style>
</head>
<body>
  <div class="panel">
    <h1>SentinelUI — P1 in-game host</h1>
    <div class="sub">CEF 144 · transparent OSR · software path · dedicated thread</div>
    <div class="row">
      <div class="clock" id="clock">--:--:--</div>
      <button class="btn" id="ping">Ping host (console.log)</button>
      <button class="btn" id="togglebg">Toggle panel</button>
    </div>
    <div id="logline"></div>
    <div class="hint">F9 = show/hide layer · F10 = capture/release input (mouse+keys)</div>
  </div>

<script>
  const clock = document.getElementById('clock');
  const logline = document.getElementById('logline');
  const panel = document.querySelector('.panel');

  function pad(n) { return String(n).padStart(2, '0'); }
  setInterval(() => {
    const d = new Date();
    clock.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }, 1000);

  document.getElementById('ping').addEventListener('click', () => {
    console.log('NUI_TEST:p1-button-clicked');
    logline.textContent = 'clock is live (JS repaint works)';
  });
  document.getElementById('togglebg').addEventListener('click', () => {
    const bg = getComputedStyle(panel).backgroundColor;
    panel.style.background = bg.indexOf('0.72') !== -1 ? 'rgba(10,14,22,0.96)' : 'rgba(10,14,22,0.72)';
  });
</script>
</body>
</html>
